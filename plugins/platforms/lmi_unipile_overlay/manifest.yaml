# Canonical source manifest for the LMI Unipile live overlays.
#
# The referenced live files are read-only review inputs.  This manifest does
# not install, enable, deploy, or call a provider.  An operator must explicitly
# review and copy the pinned inputs into a deployment-owned environment.
manifest_version: 1
name: lmi-unipile-live-overlay
kind: platform-overlay
status: review-only
deployment:
  enabled: false
  provider_calls: prohibited
  target: plugins/platforms/lmi_unipile_overlay
  live_overlay_root: /opt/opencomputer-v2-data/plugins

media_bridge_source:
  repository: https://github.com/archits01/lmi-dashboard.git
  commit: fb460d4e66c018ee7b5b8d55ba476664f7e3f0a8
  path: vm/leadgen/unipile_media_followup.py

channels:
  - name: whatsapp
    adapter_input: whatsapp_unipile/adapter.py
    env_prefix: WHATSAPP_UNIPILE_
  - name: instagram
    adapter_input: instagram/adapter.py
    env_prefix: INSTAGRAM_UNIPILE_

source_inputs:
  - path: _unipile_common.py
    sha256: 65af0cb2c98e1c11f348034dbf7a4fef1fc312cd7aedd5fc4395504339d6eb28
  - path: whatsapp_unipile/adapter.py
    sha256: 83f183bcffa483f4839414e33bc47008a29dfbce9b23abb8e0eb3619bf50ba6d
  - path: instagram/adapter.py
    sha256: e7429a174336c28801c07d4f2a3bf287e84f5c48fe616905371f031e3aebd63e
deployment_sources:
  root: plugins/platforms/lmi_unipile_overlay/live_inputs
  targets:
    - source: _unipile_common.py
      target: plugins/platforms/_unipile_common.py
    - source: whatsapp_unipile/adapter.py
      target: plugins/platforms/whatsapp_unipile/adapter.py
    - source: instagram/adapter.py
      target: plugins/platforms/instagram/adapter.py
bundled_runtime:
  - path: plugins/platforms/lmi_unipile_overlay/_lmi_media_runtime.py
    sha256: 371096adbf0af11eac1e84e7ddc3e792e80c07bfe530d300ae16fb33b57f60c9
  - path: plugins/platforms/lmi_unipile_overlay/_lmi_media_bootstrap.py
    sha256: 7501f1371db1ecfcbf16cf3ce2c94b1fd38c6ee69ebc48944715a551599639be
media_bridge:
  path: unipile_media_followup.py
  sha256: 97247849a2fef683f1af912cb54496511b2e0d84e7bf2ce1a6a524c2c2872fdd
  required_templates:
    offer: portfolio-media-v1
    caption: portfolio-delivery-v1
  required_inputs:
    - exact inbound provider message id
    - operator-approved media ids
  forbidden_inputs:
    - arbitrary file paths
    - URLs
    - model-generated captions

adapter_bridge:
  module: plugins.platforms.lmi_unipile_overlay.bridge
  tools:
    - whatsapp_offer_media
    - whatsapp_send_approved_media
    - instagram_offer_media
    - instagram_send_approved_media
  consent: exact-inbound-message-id-only
  scope: adapter-bound-session-only
  media_catalog: reviewed-bridge-approved_media
