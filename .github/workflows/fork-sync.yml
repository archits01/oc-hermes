name: Fork Sync (upstream Hermes → sync candidate)

# Daily upstream catch-up for the OpenComputer fork.
#
# Deliberately does NOT push oc-branding. Customers install from oc-branding
# (scripts/install.sh, install.ps1 and the desktop update check all resolve to
# archits01/hermes-agent @ oc-branding), so an unreviewed auto-merge there ships
# straight to real installs. Instead this produces a candidate branch a human
# fast-forwards after review.
#
# Fails loudly on conflict or on a lost OpenComputer file. A failed scheduled run
# emails the repo owner through GitHub's own notifications, which is why this does
# not depend on Issues - Issues are disabled on forks by default and the previous
# version of this workflow died with HTTP 410 trying to file one, so nobody was
# told for days.

on:
  schedule:
    - cron: '0 6 * * *'   # daily 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout oc-branding
        uses: actions/checkout@v4
        with:
          ref: oc-branding
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "fork-sync[bot]"
          git config user.email "fork-sync@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/NousResearch/hermes-agent.git || \
            git remote set-url upstream https://github.com/NousResearch/hermes-agent.git
          git fetch --no-tags upstream main

      - name: Anything to merge?
        id: gap
        run: |
          behind="$(git rev-list --count HEAD..upstream/main)"
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "oc-branding is $behind commits behind upstream/main"

      - name: Merge onto a candidate branch
        if: steps.gap.outputs.behind != '0'
        id: merge
        run: |
          BR="sync/upstream-$(date -u +%Y%m%d)"
          echo "branch=$BR" >> "$GITHUB_OUTPUT"
          git checkout -b "$BR"
          if git merge --no-ff --no-edit upstream/main; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            echo "::error::Merge conflict. Files:"
            git diff --name-only --diff-filter=U
            # Do NOT abort. Aborting threw the conflicted tree away and left the
            # owner with a failure email and nothing to resolve from, so the sync
            # simply never happened. Commit the conflicted state (markers and all)
            # to a clearly-named branch so it can be resolved in a PR or locally.
            # The invariant gate below is skipped on this path (clean != true), so
            # the committed markers cannot be mistaken for a shippable candidate,
            # and oc-branding is still never pushed.
            CB="${BR}-CONFLICTS"
            echo "conflict_branch=$CB" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U > /tmp/conflicted.txt
            # GITHUB_TOKEN is not permitted to push commits that modify files under
            # .github/workflows/ - the push is rejected with "refusing to allow a
            # GitHub App to create or update workflow ... without workflows
            # permission". There is no `workflows:` key in the permissions block and
            # actions:write does not grant it; the only token that can is a PAT with
            # the workflow scope. Rather than require a new secret, keep OUR workflow
            # files, which is what a fork wants regardless - upstream CI should not
            # silently replace the fork's own pipelines. Any upstream workflow change
            # is reported below so it can be ported by hand.
            git diff --name-only HEAD...upstream/main -- .github/workflows/ > /tmp/wf_changed.txt 2>/dev/null || true
            git checkout HEAD -- .github/workflows/ 2>/dev/null || true
            git add -A
            # `git checkout HEAD --` restores files we already had, but it cannot
            # remove ones upstream ADDED (2026-08-20: upstream renamed ci.yml to
            # ci.yaml, so ci.yaml stayed staged as a new file and the push was still
            # rejected). Drop any workflow file that is an addition relative to HEAD.
            git diff --cached --name-only --diff-filter=A -- .github/workflows/ \
              | xargs -r git rm -f --quiet --
            git commit -m "UNRESOLVED upstream merge $(date -u +%Y-%m-%d) - contains conflict markers, do not ff-only this" >/dev/null
            git branch -M "$CB"
            git push -f origin "$CB"
            {
              echo "### Upstream sync BLOCKED on conflicts"
              echo ""
              echo "Branch \`$CB\` was pushed with the conflict markers in place."
              echo ""
              echo "Conflicted files:"
              echo '```'
              cat /tmp/conflicted.txt
              echo '```'
              if [ -s /tmp/wf_changed.txt ]; then
                echo "Upstream ALSO changed these workflow files. They were NOT taken"
                echo "(GITHUB_TOKEN cannot push them); port by hand if wanted:"
                echo '```'
                cat /tmp/wf_changed.txt
                echo '```'
              fi
              echo "Resolve:"
              echo '```'
              echo "git fetch origin && git checkout $CB"
              echo "# fix the markers, then:"
              echo "git commit -a --amend --no-edit"
              echo "git checkout oc-branding && git merge --no-ff $CB"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: OpenComputer invariants must survive
        if: steps.merge.outputs.clean == 'true'
        run: |
          fail=0
          for f in \
            scripts/fork-sync.sh \
            optional-mcps/sarvam-voice/server/main.py \
            optional-mcps/unipile/server/src/mcp_server_unipile_extended/server.py \
            tools/media_store.py \
            apps/desktop/src/plugins/lmi-dashboard/plugin.tsx \
            apps/desktop/electron/default-connection.ts \
            apps/desktop/public/flower.png \
            scripts/ops/lmi_opencomputer_v2_update.sh ; do
            [ -e "$f" ] || { echo "::error::OC file lost in merge: $f"; fail=1; }
          done
          # A clean merge can still silently delete branding when upstream renames a
          # file - that produces no conflict at all, so assert the markers directly.
          grep -q OpenComputer hermes_cli/default_soul.py || { echo "::error::branding lost: default_soul.py"; fail=1; }
          grep -q OpenComputer scripts/install.sh          || { echo "::error::branding lost: install.sh"; fail=1; }
          grep -q archits01  scripts/install.sh            || { echo "::error::install.sh no longer points at the fork"; fail=1; }
          grep -q archits01  scripts/install.ps1           || { echo "::error::install.ps1 no longer points at the fork"; fail=1; }
          grep -rq OpenComputer apps/desktop/src/i18n/en.ts || { echo "::error::branding lost: i18n en.ts"; fail=1; }
          # The LMI platforms must stay classified as messaging sources, or every
          # customer conversation lands in the global Sessions sidebar. Upstream has
          # no idea these adapters exist, so its copy of session-source.ts silently
          # reverts this - which is exactly what happened on 2026-08-19.
          for p in linkedin instagram whatsapp_unipile messenger_unipile ; do
            grep -q "'$p'" apps/desktop/src/lib/session-source.ts || { echo "::error::$p dropped from MESSAGING_SESSION_SOURCE_IDS - customer chats will flood the Sessions sidebar"; fail=1; }
          done
          test "$(git grep -l '^<<<<<<< ' | wc -l)" -eq 0   || { echo "::error::conflict markers committed"; fail=1; }
          exit $fail

      - name: Push the candidate
        if: steps.merge.outputs.clean == 'true'
        run: |
          git push origin "${{ steps.merge.outputs.branch }}"
          echo "### Upstream sync candidate ready" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: \`${{ steps.merge.outputs.branch }}\` (${{ steps.gap.outputs.behind }} upstream commits)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Review, then ship it:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "git checkout oc-branding" >> "$GITHUB_STEP_SUMMARY"
          echo "git merge --ff-only ${{ steps.merge.outputs.branch }}" >> "$GITHUB_STEP_SUMMARY"
          echo "git push origin oc-branding" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
